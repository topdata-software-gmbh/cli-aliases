[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-aliases"
version = "0.1.0"
description = "Git-style user-global pre-parse command aliases for Typer CLIs (shared by sb and ctx)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Marc" }]
dependencies = ["typer>=0.9.0", "rich>=13.7.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_aliases"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
